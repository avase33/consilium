name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev + server extras)
        run: pip install -e ".[dev,server]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the CLI (offline mock)
        run: |
          python -m consilium research "electric vehicle charging market" --md report.md --json report.json
          test -f report.md && test -f report.json
          python -m consilium runs
      - name: Import the FastAPI app
        run: python -c "import consilium.service.api as a; print('api import OK')"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t consilium:ci .
